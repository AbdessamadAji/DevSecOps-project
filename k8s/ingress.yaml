apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: bulletin-ingress
  namespace: bulletin

spec:
  ingressClassName: nginx
  rules:
    - host: bulletin.local

      http:
        paths:
          - path: /
            pathType: Prefix

            backend: # if a request came to that path , do this : 
              service:
                name: frontend-service
                port:
                  number: 80

          - path: /api
            pathType: Prefix

            backend:
              service:
                name: backend-service
                port:
                  number: 8080








