apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: bulletin

data:
  nginx.conf: |
    pid /tmp/nginx.pid;

    events {}

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        server {
            listen 8080;

            root /usr/share/nginx/html;
            index index.html;

            location / {
                try_files $uri $uri/ /index.html;
            }
        }
    }
