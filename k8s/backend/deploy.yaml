apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deploy
  namespace: bulletin

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend-container
          image: nighthawk777/devsecops-backend:v1
          imagePullPolicy: Always

          ports:
            - containerPort: 8080
            - containerPort: 9090

          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret

          resources:
            requests: # minimum resources guaranteed
              cpu: "100m"
              memory: "128Mi"

            limits: # maximum resources allowed
              cpu: "500m"
              memory: "512Mi"

          livenessProbe: # Kubernetes checks if the application is still alive
            httpGet:
              path: /actuator/health/liveness
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe: # Kubernetes checks if the application is ready to receive traffic
            httpGet:
              path: /actuator/health/readiness
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3


          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL

            seccompProfile:
              type: RuntimeDefault

            #readOnlyRootFilesystem: true : not sure if the app needs to write as root
