apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bulletin-project
  namespace: argocd

spec:
  description: Project for the Bulletin application

  sourceRepos:
    - "https://github.com/AbdessamadAji/DevSecOps-project"

  destinations:
    - namespace: bulletin
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: "*"
      kind: "*"

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
