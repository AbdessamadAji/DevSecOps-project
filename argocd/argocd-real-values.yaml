global:
  domain: ""

configs:
  cm:
    admin.enabled: true

server:
  replicas: 1

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  metrics:
    enabled: true

    serviceMonitor:
      enabled: true
      namespace: monitoring

controller:
  replicas: 1

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  metrics:
    enabled: true

    serviceMonitor:
      enabled: true
      namespace: monitoring

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  metrics:
    enabled: true

    serviceMonitor:
      enabled: true
      namespace: monitoring

redis:
  enabled: true

dex:
  enabled: false

notifications:
  enabled: false

applicationSet:
  replicas: 1
