name: DevSecOps CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: read


jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # brings all commits : gitleaks needs it .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend
        run: |
          cd frontend
          npm ci

      - name: Frontend Code Quality
        run: |
          cd frontend
          npm run lint




      # -------------------------
      # Gitleaks
      # -------------------------
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------
      # SAST
      # --------------------------

      - name: SAST Scan
        uses: returntocorp/semgrep-action@v1


      # -------------------------
      # Trivy Filesystem Scan instead of gradle depndency check
      # -------------------------

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL


      # -------------------------
      # Tests
      # -------------------------

      - name: Backend Tests
        run: ./gradlew test


      # -------------------------
      # Build
      # -------------------------

      - name: Build Backend
        run: ./gradlew bootJar

      - name: Build Frontend
        run: |
          cd frontend
          npm run build


      # -------------------------
      # Upload Artifacts
      # -------------------------

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-jar
          path: build/libs/*.jar

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: frontend/dist


      # -------------------------
      # Run application
      # -------------------------

      - name: Start Backend
        run: |
          java -jar build/libs/*.jar > backend.log 2>&1 &


      # -------------------------
      # Wait for backend
      # -------------------------


      - name: Wait for Backend
        run: |
          for i in {1..30}; do
            if curl -fs http://localhost:9090/actuator/health; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 5
          done

          echo "Backend failed to start"
          cat backend.log
          exit 1


      # -------------------------
      # Docker
      # -------------------------

      - name: Build Backend Image
        run: docker build -t nighthawk777/devsecops-backend:v1 .

      - name: Build Frontend Image
        run: docker build -t nighthawk777/devsecops-frontend:v1 ./frontend



      # -------------------------
      # Docker Scan
      # -------------------------

      - name: Trivy Backend Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nighthawk777/devsecops-backend:v1
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL

      - name: Trivy Fronend Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nighthawk777/devsecops-frontend:v1
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL


      # DAST
      # -------------------------

      - name: OWASP ZAP Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:8080/swagger-ui/index.html"



      # -------------------------
      # Push Images
      # -------------------------

      - name: Login Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push Backend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push nighthawk777/devsecops-backend:v1

      - name: Push Frontend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push nighthawk777/devsecops-frontend:v1
