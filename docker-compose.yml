services:
  db:
    image: postgres:18.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db:/data/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s    # test every 10s
      timeout: 5s
      retries: 5
      start_period: 30s    # after starting the container, wait 30s then do the test
    networks:
      - bulletin-network

  backend:
    build:     # Build a custom image from a Dockerfile
      context: ./   # the files you can see : in root 
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - bulletin-network
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend/
    depends_on:
      - backend
    ports:
      - "80:80" # ask about it 
    networks:
      - bulletin-network


networks:
  bulletin-network:

volumes:
  db:
  uploads:
