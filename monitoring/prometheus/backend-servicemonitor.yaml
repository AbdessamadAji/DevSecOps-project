apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-servicemonitor
  namespace: bulletin
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      monitoring: enabled
  namespaceSelector:
    matchNames:
      - bulletin
  endpoints:
    - port: management
      path: /actuator/prometheus
      interval: 15s
